name: Release

# Nothing is published to npm. Changesets is used only for versioning and CHANGELOG.md.
#
# 1. While .changeset/*.md files exist on main, changesets/action opens (or updates)
#    a "Version packages" PR that bumps package.json and writes CHANGELOG.md.
# 2. When that PR is merged there are no pending changesets and package.json carries
#    a version without a tag. This workflow then builds everything, attaches
#    ikas-app-ui-v<version>.tar.gz (r/, ui-preview/, manifest/, thumbnails/) to a GitHub release
#    and creates the v<version> tag.
# 3. Optionally (needs setup, see the last job) it opens a PR on ikascom/ikas-builders
#    that bumps the ui-kit version, so builders.ikas.com serves the new release.
#
# Repo setting required: Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests". Note that PRs opened with GITHUB_TOKEN do not trigger CI;
# re-run CI on the version PR by closing and reopening it, or switch to an App token.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          pr-title: Version packages
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Is there an untagged version?
        id: check
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.release == 'true'
        run: pnpm build

      - name: Package
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          mkdir -p release
          cp -R dist/r release/r
          cp -R dist/manifest release/manifest
          cp -R preview/out release/ui-preview
          parts="r ui-preview manifest"
          if [ -f dist/thumbnails/index.json ]; then cp -R dist/thumbnails release/thumbnails; parts="$parts thumbnails"; fi
          tar -czf "ikas-app-ui-v$VERSION.tar.gz" -C release $parts

      - name: Create GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Release v$VERSION" > notes.md
          gh release create "v$VERSION" "ikas-app-ui-v$VERSION.tar.gz" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
