name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. This workflow never needs secrets and never runs with write access,
# so it is safe for pull requests from forks. Do not switch it to pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Content checks
        run: pnpm check:content

      - name: Build registry
        run: pnpm registry:build
      - name: registry.json is up to date
        run: |
          git diff --exit-code registry.json || {
            echo "::error file=registry.json::registry.json is out of date. Run 'pnpm registry:build' and commit the result."
            exit 1
          }
      - name: Validate registry
        run: pnpm registry:validate

      - name: Build manifest
        run: pnpm manifest:build
      - name: Build previews
        run: pnpm preview:build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/r
            dist/manifest
            preview/out
          retention-days: 7

  smoke:
    name: Install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      # Installs every @ikas item into a fresh ikas starter app and type-checks it.
      - run: pnpm smoke

  health:
    name: Registry health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      # Mirrors shadcn's Registry Health check: dist/r hygiene, then
      # `shadcn add @ikas/<item> --dry-run --yes` for every item in a bare project.
      - run: pnpm health
